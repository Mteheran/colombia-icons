name: Publish NuGet package

# Publishes the Blazor package (ColombiaIcons.Blazor) to NuGet.org.
# Triggered by pushing a version tag (e.g. v0.2.0), which the /publicar-version
# skill creates. Requires the NUGET_API_KEY secret (an API key with push access
# to the ColombiaIcons.Blazor package / your NuGet.org account).

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Exposed at job level so it can be checked in a step `if` below.
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Regenerate the .razor components from icons/svg so the published package
      # can never drift from the source of truth (same guard as publish-npm).
      - run: npm run generate

      # Fail early if the tag and the csproj version disagree.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER="$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' packages/blazor/ColombiaIcons.Blazor.csproj)"
          echo "tag=$TAG csproj=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag v$TAG does not match csproj <Version> $VER"
            exit 1
          fi

      - name: Pack
        run: dotnet pack packages/blazor/ColombiaIcons.Blazor.csproj -c Release -o ./nupkg

      # Skip (don't fail) when the NuGet token isn't configured yet, so an npm-only
      # first release isn't blocked. Once NUGET_API_KEY is set, re-run this workflow
      # (or push the next tag) to publish the Blazor package.
      - name: Skip note (no NuGet token)
        if: env.NUGET_API_KEY == ''
        run: echo "::warning::NUGET_API_KEY is not set — skipping the NuGet push. Add the secret and re-run to publish ColombiaIcons.Blazor."

      - name: Push to NuGet.org
        if: env.NUGET_API_KEY != ''
        run: >
          dotnet nuget push "./nupkg/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

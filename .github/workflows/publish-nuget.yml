name: Publish NuGet package

# Publishes the Blazor package (ColombiaIcons.Blazor) to NuGet.org via
# Trusted Publishing (OIDC) — no long-lived API key. Triggered by pushing a
# version tag (e.g. v0.2.0), which the /publicar-version skill creates.
#
# Requires a Trusted Publishing policy configured on NuGet.org that points at
# this repository and this workflow file (owner: mteheran). See:
# https://learn.microsoft.com/nuget/nuget-org/trusted-publishing

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for the OIDC token exchange with NuGet.org

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Regenerate the .razor components from icons/svg so the published package
      # can never drift from the source of truth (same guard as publish-npm).
      - run: npm run generate

      # Fail early if the tag and the csproj version disagree.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER="$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' packages/blazor/ColombiaIcons.Blazor.csproj)"
          echo "tag=$TAG csproj=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag v$TAG does not match csproj <Version> $VER"
            exit 1
          fi

      - name: Pack
        run: dotnet pack packages/blazor/ColombiaIcons.Blazor.csproj -c Release -o ./nupkg

      # Exchange the GitHub OIDC token for a short-lived NuGet API key using the
      # Trusted Publishing policy configured on NuGet.org for user 'mteheran'.
      - name: NuGet login (Trusted Publishing / OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: mteheran

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "./nupkg/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

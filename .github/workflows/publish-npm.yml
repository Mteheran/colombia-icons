name: Publish npm packages

# Publishes the React and Angular packages to npm.
# Triggered by pushing a version tag (e.g. v0.2.0), which the /publicar-version
# skill creates. Requires the NPM_TOKEN secret (a granular/automation token with
# publish access to the @mteherandev scope).

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Regenerate components from icons/svg so the published output can never
      # drift from the source of truth.
      - run: npm run generate

      - run: npm run build --workspace @mteherandev/colombia-icons-react
      - run: npm run build --workspace @mteherandev/colombia-icons-angular

      # Fail early if the tag and the package version disagree.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Publish React
        run: npm publish --workspace @mteherandev/colombia-icons-react --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ng-packagr writes the publishable package (with its own package.json) to dist.
      - name: Publish Angular
        run: npm publish ./packages/angular/dist --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
